version: 2
updates:
  # Python依存関係の更新設定
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "yokohama4580"
    labels:
      - "pip dependencies"
      - "dependencies"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "pylint"
      aws-dependencies:
        patterns:
          - "boto3"
          - "aws-cdk*"
          - "constructs"

  # GitHub Actionsの更新設定
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "github actions"
      - "dependencies"